{% extends "base.html" %}

{% block title %}Login - SailArchive{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-4">
        <div class="card">
            <div class="card-header">
                <h4 class="mb-0">Login</h4>
            </div>
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    
                    <div class="mb-3">
                        <label for="id_username" class="form-label">Email</label>
                        <input type="email" class="form-control" id="id_username" name="username" required autofocus>
                    </div>
                    
                    <div class="mb-3">
                        <label for="id_password" class="form-label">Password</label>
                        <input type="password" class="form-control" id="id_password" name="password" required>
                    </div>
                    
                    {% if form.errors %}
                    <div class="alert alert-danger">
                        Invalid email or password.
                    </div>
                    {% endif %}
                    
                    <button type="submit" class="btn btn-primary w-100">Login</button>
                </form>
            </div>
            <div class="card-footer text-center">
                <a href="{% url 'auth_password_reset' %}">Forgot password?</a>
                <span class="mx-2">|</span>
                <a href="{% url 'registration_register' %}">Create account</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
