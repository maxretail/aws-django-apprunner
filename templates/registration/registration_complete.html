{% extends "base.html" %}

{% block title %}Registration Complete - SailArchive{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card">
            <div class="card-body text-center">
                <h4 class="text-success mb-3">Registration Complete!</h4>

                <a href="{% url 'auth_login' %}" class="btn btn-primary">Go to Login</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
