name: Deploy to DigitalOcean App Platform

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  REGISTRY: registry.digitalocean.com
  APP_NAME: sailarchive

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Build frontend (if exists)
        run: |
          if [ -d "frontend" ] && [ -f "frontend/package.json" ]; then
            cd frontend
            npm ci
            npm run build
          fi

      - name: Log in to DigitalOcean Container Registry
        run: doctl registry login --expiry-seconds 1200

      - name: Build and push Docker image
        run: |
          docker build -t ${{ env.REGISTRY }}/${{ env.APP_NAME }}:${{ github.sha }} -t ${{ env.REGISTRY }}/${{ env.APP_NAME }}:latest --target production .
          docker push ${{ env.REGISTRY }}/${{ env.APP_NAME }}:${{ github.sha }}
          docker push ${{ env.REGISTRY }}/${{ env.APP_NAME }}:latest

      - name: Deploy to App Platform
        run: |
          # Update app spec with new image tag
          doctl apps update ${{ secrets.DO_APP_ID }} --spec .do/app.yaml

      - name: Wait for deployment
        run: |
          echo "Waiting for deployment to complete..."
          sleep 30
          # Get deployment status
          doctl apps list-deployments ${{ secrets.DO_APP_ID }} --format ID,Phase,Progress --no-header | head -1

      - name: Get App URL
        run: |
          APP_URL=$(doctl apps get ${{ secrets.DO_APP_ID }} --format DefaultIngress --no-header)
          echo "🚀 Deployed to: https://$APP_URL"
          echo "📊 Health check: https://$APP_URL/health/"
